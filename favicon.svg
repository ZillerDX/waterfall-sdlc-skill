<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="step1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="step2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="step3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#glow-grad)" stroke-width="2.5" />

  <!-- Cascading Waterfall Blocks -->
  <g filter="url(#glow)">
    <!-- Stage 1 (Top Left) -->
    <rect x="12" y="12" width="16" height="11" rx="3.5" fill="url(#step1-grad)" />
    
    <!-- Stage 2 (Center) -->
    <rect x="24" y="26.5" width="16" height="11" rx="3.5" fill="url(#step2-grad)" />
    
    <!-- Stage 3 (Bottom Right) -->
    <rect x="36" y="41" width="16" height="11" rx="3.5" fill="url(#step3-grad)" />
    
    <!-- Connecting Waterfall Streams -->
    <path d="M20 23 v5.5 a2 2 0 0 0 2 2 h2" stroke="url(#glow-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 37.5 v5.5 a2 2 0 0 0 2 2 h2" stroke="url(#glow-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>